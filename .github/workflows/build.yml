name: Build

# 仅为「试装/自测」产出构建产物（上传 Artifacts，不发 Release）。
# 正式发版请打 v* tag，走 release.yml。
on:
  workflow_dispatch:
    inputs:
      bundles:
        description: 'tauri --bundles 参数（默认 nsis）'
        required: false
        default: nsis
  push:
    branches:
      - 'feat/**'
      - 'build/**'

jobs:
  windows:
    name: Build Windows artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # tauri-cli 每次构建都会重新下载 NSIS 工具链（~1 分钟）：缓存它
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-cli-nsis-${{ runner.os }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 跨分支共享同一份热缓存（否则新分支首建=全量冷编译）+ 失败也保存
          #（此前失败连锁导致缓存从未保存，每次构建都冷编译依赖）
          shared-key: windows-build
          cache-on-failure: true

      - name: Install frontend deps
        run: npm ci

      - name: Check i18n keys
        run: npm run check:i18n

      - name: Check auto-switch decision logic
        run: npm run check:autoswitch

      # 特性分支也跑 Rust 单测（原先只有 ci.yml 在 PR/main 上跑，feat/** 开发时测不到）
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build (前端 + Rust + NSIS)
        env:
          # 编译后缀注入：app_version 读取（本地构建无此变量 → 纯版本号）
          ZSW_BUILD_SHA: ${{ github.sha }}
        run: npm run tauri build -- --bundles ${{ github.event.inputs.bundles || 'nsis' }}

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse --short HEAD)
          mkdir -p out
          cp "src-tauri/target/release/zcode-switch.exe" "out/zcode-switch_${VER}_${SHA}_portable.exe"
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/"
          (cd out && sha256sum * > checksums.txt)
          ls -l out

      - uses: actions/upload-artifact@v5
        with:
          name: zcode-switch-windows-x64
          path: out/*
          if-no-files-found: error
          retention-days: 14
